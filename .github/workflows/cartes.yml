# Les rues de plusieurs pays, préparées pour l'app et hébergées en ligne.
#
# Loin de la région livrée dans l'app, la première recherche attendait Overpass,
# un serveur public qui calcule chaque requête — de vingt secondes à plusieurs
# minutes. Chaque mois, ce workflow télécharge l'extrait OpenStreetMap de chaque
# pays chez Geofabrik, le découpe en tuiles (frontend/scripts/region_tiles.py
# --pack) et le dépose sur Hugging Face. L'app n'en lit ensuite que les
# morceaux dont elle a besoin : voir frontend/src/engine/remote.js.
#
# À régler une fois dans le dépôt GitHub (Settings → Secrets and variables →
# Actions) :
#   - le secret HF_TOKEN : un jeton Hugging Face avec le droit d'écriture ;
#   - la variable HF_DATASET : « nom-d-utilisateur/lacet-cartes ».
# Sans eux, le workflow ne fait rien, et l'app garde Overpass hors de sa région.

name: Cartes des pays (Hugging Face)

on:
  workflow_dispatch:
  # Le 1er de chaque mois, à l'aube.
  schedule:
    - cron: '0 3 1 * *'

concurrency:
  group: cartes
  cancel-in-progress: false

jobs:
  pays:
    if: vars.HF_DATASET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Trois à la fois : Geofabrik demande de ne pas multiplier les
      # téléchargements simultanés, et Hugging Face reçoit les envois en file.
      max-parallel: 3
      matrix:
        include:
          - { id: france, path: europe/france, name: France }
          - { id: switzerland, path: europe/switzerland, name: Suisse }
          - { id: belgium, path: europe/belgium, name: Belgique }
          - { id: luxembourg, path: europe/luxembourg, name: Luxembourg }
          - { id: germany, path: europe/germany, name: Allemagne }
          - { id: italy, path: europe/italy, name: Italie }
          - { id: spain, path: europe/spain, name: Espagne }
          - { id: austria, path: europe/austria, name: Autriche }
          - { id: andorra, path: europe/andorra, name: Andorre }
    steps:
      - uses: actions/checkout@v4

      # Le grand disque temporaire de la machine : un pays comme la France pèse
      # 5 Go d'extrait, autant de tri intermédiaire, et l'index de ses nœuds.
      - name: Place sur le disque
        run: |
          sudo mkdir -p /mnt/cartes
          sudo chown "$(id -u):$(id -g)" /mnt/cartes
          df -h / /mnt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outils
        run: pip install --quiet osmium huggingface_hub

      - name: Rues — ${{ matrix.name }}
        working-directory: /mnt/cartes
        env:
          TMPDIR: /mnt/cartes
        run: |
          curl -sSfL -o pays.osm.pbf "https://download.geofabrik.de/${{ matrix.path }}-latest.osm.pbf"
          curl -sSfL -o pays.poly "https://download.geofabrik.de/${{ matrix.path }}.poly"
          ls -la pays.osm.pbf
          python "$GITHUB_WORKSPACE/frontend/scripts/region_tiles.py" pays.osm.pbf pays.poly out \
            --name "${{ matrix.name }}" --pack --locations "sparse_file_array,/mnt/cartes/noeuds.bin"
          rm -f pays.osm.pbf noeuds.bin
          ls -la out

      - name: Publication
        working-directory: /mnt/cartes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
        run: python "$GITHUB_WORKSPACE/frontend/scripts/publish_tiles.py" pays out "${{ matrix.id }}"

  catalogue:
    needs: pays
    # Même si un pays a échoué : le catalogue liste ce qui est publié.
    if: always() && vars.HF_DATASET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet huggingface_hub
      - name: Catalogue
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
        run: python frontend/scripts/publish_tiles.py catalogue
