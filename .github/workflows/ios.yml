# L'app iPhone, compilée sur un Mac de GitHub.
#
# Une IPA ne se compile qu'avec Xcode, donc sur macOS. Ce workflow le fait à
# chaque changement du front, et à la demande (onglet Actions → « Run workflow »).
# L'IPA produite n'est pas signée : c'est AltStore qui la signe, avec le compte
# Apple de la personne, au moment de l'installer sur son téléphone.
#
# Le dossier `ios/` n'est pas versionné : il est régénéré ici à chaque fois, puis
# réglé par `frontend/ios-overlay/customize.py` (autorisations de position, GPS
# et voix en arrière-plan, session audio). Voir ce fichier pour le pourquoi.

name: App iPhone (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ios.yml'
  # Chaque lundi matin, une IPA neuve avec les rues de la semaine : il suffit de
  # la télécharger en mettant l'app à jour dans AltStore, qui la re-signe de
  # toute façon tous les sept jours.
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Les deux gros fichiers de cette compilation — les rues de la région, puis
# l'IPA — voyagent par une **publication** (`release`) et non par des artefacts.
#
# Les artefacts ont un quota de cinq cents mégaoctets sur un dépôt privé. Une
# IPA en pèse quarante, la région trente-huit : au bout de six compilations, la
# suivante échoue à l'envoi, et les cinq précédentes doivent être effacées à la
# main pour que la sixième passe. C'est arrivé, et c'est arrivé au mauvais
# moment — une version prête, impossible à livrer.
#
# Une publication ne compte pas dans ce quota, garde un lien stable par version,
# et se télécharge d'une ligne depuis le PC :
#
#     gh release download v1.0.58 --pattern Lacet.ipa
permissions:
  contents: write

jobs:
  # Les tests d'abord : une IPA construite sur un moteur qui ne calcule plus
  # comme la référence serait pire qu'aucune IPA. Ce sont ceux de `tests.yml`,
  # sur Linux — ils tournaient aussi sur le Mac, où chaque minute en coûte dix,
  # et après la création de la publication : un test rouge laissait une
  # version sans IPA. Rien ne part désormais avant qu'ils soient verts.
  tests:
    uses: ./.github/workflows/tests.yml

  # La carte régionale livrée dans l'app : toutes les rues de la région, prêtes,
  # pour ne plus rien attendre d'Overpass quand on court chez soi. Voir
  # frontend/scripts/region_tiles.py. Calculée une fois par semaine : les
  # compilations de la même semaine reprennent le résultat en cache.
  #
  # **Et elle déborde de la limite administrative.** Une carte qui s'arrête pile
  # à la frontière laisse sans rues quiconque habite près d'elle : constaté à
  # Bréchaumont, à deux kilomètres du Territoire de Belfort, où deux des six
  # tuiles d'une sortie de 5 km manquaient. Les extraits des régions voisines
  # sont donc coupés à une même emprise, fusionnés, et seules les tuiles qui y
  # tiennent entièrement sont livrées — le débord est aussi complet que le reste.
  region:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Le chemin de l'extrait chez Geofabrik (download.geofabrik.de/europe/…).
      REGION: france/alsace
      REGION_NAME: Alsace
      # Ce qui entoure la région, pour remplir la marge. L'Alsace touche la
      # Lorraine, la Franche-Comté, deux Länder allemands et la Suisse.
      NEIGHBOURS: >-
        france/lorraine
        france/franche-comte
        germany/baden-wuerttemberg
        germany/rheinland-pfalz
        switzerland
      # Mille cinq cents mètres : de quoi que **toutes** les tuiles que la limite
      # traverse soient livrées entières — c'est là qu'était le trou, pas plus
      # loin. Mesuré depuis Bréchaumont, à deux kilomètres du Territoire de
      # Belfort : plus une seule tuile manquante pour une sortie de 10 km, et la
      # carte pèse onze mégaoctets de moins qu'avec six kilomètres de marge. Ce
      # qui dépasse encore — un semi-marathon lancé depuis la frontière — vient
      # des archives en ligne, en une seconde.
      MARGIN_M: 1500
    steps:
      # Tout l'historique, étiquettes comprises : les notes de la publication
      # listent ce qui a changé depuis la précédente.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Chemin absolu : le job IPA travaille dans `frontend/`. Un échec du calcul
      # arrête l'étape, au lieu d'écrire une version vide.
      - name: Numéro de version
        run: |
          V="$(python3 "$GITHUB_WORKSPACE/scripts/version.py")"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Semaine
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: region
          key: region-${{ env.REGION }}-m${{ env.MARGIN_M }}-${{ steps.week.outputs.week }}-${{ hashFiles('frontend/scripts/region_tiles.py', 'frontend/scripts/region_bbox.py') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Rues de la région et de ses abords
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium

          curl -sSfL -o region.poly "https://download.geofabrik.de/europe/${REGION}.poly"
          BBOX="$(python frontend/scripts/region_bbox.py region.poly "$MARGIN_M")"
          echo "emprise à couvrir : $BBOX"

          # Chaque extrait est coupé à cette emprise dès son arrivée, puis
          # effacé : le disque du runner ne tient pas les originaux ensemble.
          n=0
          for zone in "$REGION" $NEIGHBOURS; do
            n=$((n + 1))
            echo "::group::$zone"
            curl -sSfL -o source.osm.pbf "https://download.geofabrik.de/europe/${zone}-latest.osm.pbf"
            osmium extract --bbox "$BBOX" --set-bounds --overwrite -o "part-$n.osm.pbf" source.osm.pbf
            rm source.osm.pbf
            ls -lh "part-$n.osm.pbf"
            echo "::endgroup::"
          done

          # Les objets présents des deux côtés d'une limite ne sont gardés
          # qu'une fois : c'est ce que fait `osmium merge`.
          osmium merge --overwrite -o region.osm.pbf part-*.osm.pbf
          rm part-*.osm.pbf
          ls -lh region.osm.pbf

          python frontend/scripts/region_tiles.py region.osm.pbf region.poly region \
            --name "$REGION_NAME" --margin "$MARGIN_M" --source-bbox "$BBOX"
          du -sh region

      # La publication est créée ici, par le premier des deux travaux ; l'IPA
      # viendra s'y ajouter. `--clobber` parce qu'une compilation relancée
      # écrase la précédente plutôt que d'échouer.
      #
      # **En préversion, le temps de la compilation.** Le lien « Télécharger
      # l'IPA » du README vise la dernière publication : pendant le quart d'heure
      # où celle-ci n'a encore que les rues, il aurait mené à une page sans IPA.
      # Elle devient la dernière une fois l'IPA posée — voir la fin de `ipa`.
      #
      # Ses notes disent ce qui change — les commits depuis la publication
      # précédente — et comment l'installer : « Compilation 58 » ne disait rien,
      # le téléphone en main, de ce qu'on s'apprêtait à installer.
      - name: Publication des rues de la région
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          tar -czf region.tar.gz -C region .
          ls -lh region.tar.gz
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # La dernière publication complète : une préversion restée en plan —
            # une IPA qui n'a pas compilé — n'a rien livré.
            PREV="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName' | grep -vx "$TAG" | head -n 1 || true)"
            CHANGES=""
            if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              CHANGES="$(git log --no-merges --format='- %s' "$PREV..$GITHUB_SHA")"
            fi
            # Une compilation du lundi sans nouveau commit : seules les rues ont changé.
            [ -n "$CHANGES" ] || CHANGES="- Les rues de la région, rafraîchies pour la semaine."
            {
              echo "### Ce qui change"
              echo
              echo "$CHANGES"
              echo
              echo "### Installer"
              echo
              echo "- **Par la source AltStore** : remplace \`Lacet.ipa\` à la racine du dépôt par celle-ci, lance \`python scripts/altstore_source.py\`, puis **AltStore → Lacet → Mettre à jour**."
              echo "- **Par le fichier** : télécharge \`Lacet.ipa\` ci-dessous, puis **AltStore → Mes apps → +**."
              echo
              echo "Le pas-à-pas complet : [L'installer](https://github.com/$GITHUB_REPOSITORY#linstaller)."
              echo
              echo "<sub>Commit ${GITHUB_SHA::7}${PREV:+ · changements depuis $PREV}</sub>"
            } > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Lacet $APP_VERSION" --notes-file notes.md --prerelease
          fi
          gh release upload "$TAG" region.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  ipa:
    needs: region
    # Le SDK le plus récent disponible. Une extension de widget compilée avec un
    # SDK de deux versions en retard peut n'être jamais enregistrée par un iPhone
    # récent : l'app s'installe, l'extension est ignorée, et l'activité en direct
    # reste vide — constaté sur un iPhone sous iOS 27.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      # Les trois derniers commits font le « Quoi de neuf » de la source SideStore.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      # Chemin absolu : le job IPA travaille dans `frontend/`. Un échec du calcul
      # arrête l'étape, au lieu d'écrire une version vide.
      - name: Numéro de version
        run: |
          V="$(python3 "$GITHUB_WORKSPACE/scripts/version.py")"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # Capacitor 8 exige Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        run: npm ci

      # Rangée dans public/ : Vite la copie telle quelle dans l'app.
      - name: Rues de la région
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p public/region
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern region.tar.gz --output region.tar.gz --clobber
          tar -xzf region.tar.gz -C public/region
          rm region.tar.gz
          du -sh public/region

      # Les fonds Mapbox n'apparaissent que si le secret VITE_MAPBOX_TOKEN est
      # défini dans le dépôt (Settings → Secrets and variables → Actions). Sans
      # lui, la variable est vide et l'app propose ses fonds gratuits.
      # `VITE_BUILD` : le numéro de compilation et le commit, affichés dans
      # « Mon compte ». Sans eux, impossible de savoir, téléphone en main, si
      # l'app installée est bien la dernière — ce qui a déjà coûté une soirée.
      - name: App web
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_BUILD: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Projet iOS
        run: npx cap add ios --packagemanager SPM

      - name: Icône et écran de lancement
        run: >
          npx --yes @capacitor/assets@3.0.5 generate --ios
          --assetPath resources
          --iconBackgroundColor '#0A0910' --iconBackgroundColorDark '#0A0910'
          --splashBackgroundColor '#0A0910' --splashBackgroundColorDark '#0A0910'

      - name: Synchronisation
        run: npx cap sync ios

      # `APP_VERSION` porte le numéro de compilation : deux paquets de même
      # version se distinguent alors sans dépendre de `buildVersion`, que les
      # anciennes versions d'AltStore ignorent — et la mise à jour s'y voit.
      - name: Réglages de Lacet
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 ios-overlay/customize.py ios/App

      # L'écran de verrouillage pendant la sortie est une extension iOS à part,
      # avec sa propre cible Xcode : on la greffe sur le projet généré. Voir
      # ios-overlay/add_live_activity.rb.
      - name: Activité en direct (écran verrouillé)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby ios-overlay/add_live_activity.rb ios/App/App.xcodeproj

      - name: Compilation (sans signature)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lacet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Lacet.xcarchive/Products/Applications/App.app"
          test -d "$RUNNER_TEMP/Lacet.xcarchive/Products/Applications/App.app/PlugIns/LacetWidgets.appex"

      # Ce qu'une compilation verte ne prouve pas encore : que l'écran de
      # verrouillage pourra s'afficher. Quatre conditions se vérifient ici, sur
      # le paquet réellement construit — chacune a déjà coûté une soirée à
      # chercher, téléphone en main, pourquoi l'écran restait noir.
      - name: Vérifier l'activité en direct
        run: |
          python3 - "$RUNNER_TEMP/Lacet.xcarchive/Products/Applications/App.app" <<'PY'
          import plistlib, sys
          from pathlib import Path

          app = Path(sys.argv[1])
          host = plistlib.loads((app / "Info.plist").read_bytes())
          widget = plistlib.loads((app / "PlugIns/LacetWidgets.appex/Info.plist").read_bytes())
          problems = []

          if not host.get("NSSupportsLiveActivities"):
              problems.append("NSSupportsLiveActivities absent de l'Info.plist de l'app")

          # iOS ne lance une extension que si son identifiant est un enfant de
          # celui de l'app. Sinon : activité acceptée, écran vide.
          host_id, widget_id = host.get("CFBundleIdentifier", ""), widget.get("CFBundleIdentifier", "")
          if not widget_id.startswith(host_id + "."):
              problems.append(f"extension {widget_id} non rattachée à l'app {host_id}")

          # Une extension qui ne porte pas la version de l'app est rejetée.
          for key in ("CFBundleVersion", "CFBundleShortVersionString"):
              if host.get(key) != widget.get(key):
                  problems.append(f"{key} : app {host.get(key)!r} ≠ extension {widget.get(key)!r}")

          point = widget.get("NSExtension", {}).get("NSExtensionPointIdentifier")
          if point != "com.apple.widgetkit-extension":
              problems.append(f"point d'extension inattendu : {point!r}")

          if problems:
              print("L'activité en direct ne pourra pas s'afficher :")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Activité en direct vérifiée : {host_id} → {widget_id}, version {host.get('CFBundleVersion')}")
          PY

      - name: Journal de compilation (en cas d'échec)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/xcodebuild.log" || true

      - name: IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Lacet.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/Lacet.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Lacet.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/Lacet.ipa"

      # L'IPA rejoint la publication de la région. C'est ce fichier-là que le PC
      # télécharge, pose à la racine du dépôt, puis sert à AltStore depuis
      # `altstore/` (scripts/altstore_source.py).
      #
      # Puis la publication devient la dernière, et ne garde que l'IPA : les
      # rues n'y étaient que pour passer d'un travail à l'autre — l'app les
      # contient déjà —, et trente-huit mégaoctets nommés `region.tar.gz` à côté
      # de `Lacet.ipa` faisaient chercher lequel installer. Seulement ici, une
      # fois l'IPA posée : un travail relancé après un échec retrouve ses rues.
      - name: Publication de l'IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$GITHUB_WORKSPACE/Lacet.ipa" --repo "$GITHUB_REPOSITORY" --clobber
          gh release delete-asset "$TAG" region.tar.gz --repo "$GITHUB_REPOSITORY" --yes || true
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      # La source SideStore sur internet : SideStore la relit de n'importe où, en
      # 4G aussi, et propose la mise à jour sans le PC. La branche `altstore` ne
      # garde que la source et l'icône, réécrite à chaque compilation ; l'IPA
      # reste celle de la publication, sous son numéro.
      - name: Source SideStore publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/altstore_source.py" --public
          D="$RUNNER_TEMP/altstore-branch"
          mkdir -p "$D"
          cp "$GITHUB_WORKSPACE/altstore/source.json" "$GITHUB_WORKSPACE/altstore/icon-192.png" "$D/"
          cd "$D"
          git init -q -b altstore
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Source SideStore $APP_VERSION"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" altstore
