<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` pour passer sous l'encoche ; zoom de page désactivé
         parce que la carte gère le sien et qu'un double-tap disloquerait la mise
         en page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Lacet</title>
    <meta
      name="description"
      content="Génère des boucles de course à pied depuis ta porte, en privilégiant les voies protégées."
    />

    <meta name="theme-color" content="#0A0910" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Écran d'accueil iOS : sans ces trois lignes, l'app s'ouvre dans Safari
         avec sa barre d'adresse au lieu d'occuper l'écran. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lacet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
