  <head>

    <!-- `viewport-fit=cover` pour passer sous l'encoche.

         Le zoom de page est bloqué. Il avait été rouvert au nom de
         l'accessibilité, quand Lacet se lisait aussi dans un navigateur ; dans
         l'app, il cassait tout : toucher la recherche — un champ écrit en moins
         de 16 px — faisait zoomer iOS sur la page entière, qui restait
         agrandie, coupée sur la droite, la barre du bas hors d'atteinte. Une app
         native ne se pince pas ; ceux qui ont besoin d'agrandir passent par le
         Zoom d'iOS (Réglages › Accessibilité), qui vaut pour toutes les apps,
         celle-ci comprise. La carte, elle, garde ses gestes : MapLibre
         revendique le pincement sur sa propre toile. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Lacet</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
