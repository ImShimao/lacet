<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lacet — hors ligne</title>
    <!--
      Cette page est le dernier recours du service worker : elle s'affiche quand
      l'app n'a pas pu être servie, ni depuis le réseau ni depuis le cache.

      Tout y est autonome — style en ligne, logo en SVG, polices système. Elle
      s'affiche précisément quand rien d'autre ne peut être téléchargé : une
      feuille de style externe ou une police Google la laisseraient nue.
    -->
    <style>
      :root {
        --bg: #0a0910;
        --surface: #13111a;
        --line: #2e2939;
        --text: #f2f0f7;
        --text-2: #a39eb4;
        --accent: #7c3aed;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Helvetica Neue', Arial, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px;
        text-align: center;
      }
      .mark {
        width: 68px;
        height: 68px;
        border-radius: 17px;
        overflow: hidden;
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.9);
      }
      h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      h1 span { color: var(--accent); }
      p {
        margin: 0;
        max-width: 34ch;
        font-size: 14.5px;
        line-height: 1.55;
        color: var(--text-2);
      }
      button {
        margin-top: 4px;
        background: var(--accent);
        border: none;
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 26px;
        border-radius: 13px;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      .hint {
        font-size: 12px;
        color: #767089;
        border-top: 1px solid var(--line);
        padding-top: 16px;
        margin-top: 6px;
        max-width: 34ch;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="68" height="68">
          <rect width="100" height="100" fill="#0A0910" />
          <circle cx="50" cy="50" r="30" fill="none" stroke="#8B5CF6" stroke-width="7.6" />
          <circle cx="50" cy="80" r="8.5" fill="#FFFFFF" />
        </svg>
      </div>

      <h1>Lacet<span>.</span></h1>
      <p>
        Pas de connexion, et cette partie de l'app n'a pas encore été mise de côté
        pour le hors ligne.
      </p>
      <button onclick="location.reload()">Réessayer</button>
      <p class="hint">
        Une fois l'app ouverte au moins une fois avec du réseau, elle démarre sans —
        et les parcours que tu as rendus disponibles hors ligne s'affichent avec
        leur carte.
      </p>
    </main>
  </body>
</html>
